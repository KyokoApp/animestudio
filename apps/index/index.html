<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		html, body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #000000;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#canvas-container {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #000000;
			overflow: hidden;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			image-rendering: pixelated;
		}
		#canvas:focus {
			outline: none;
		}

		/* Loading Screen */
		#loading-screen {
			position: absolute;
			inset: 0;
			background-color: #1a162b;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 999;
			transition: opacity 0.4s ease-out;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.spinner {
			width: 48px;
			height: 48px;
			border: 4px solid rgba(255, 255, 255, 0.15);
			border-top-color: #72dec2;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin-bottom: 20px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.loading-title {
			color: #ffffff;
			font-size: 20px;
			font-weight: 700;
			letter-spacing: 0.5px;
			margin-bottom: 8px;
		}
		.loading-status {
			color: #a5a1b8;
			font-size: 13px;
			margin-bottom: 20px;
			min-height: 18px;
		}
		.progress-bar-bg {
			width: 240px;
			max-width: 80vw;
			height: 8px;
			background-color: rgba(255, 255, 255, 0.1);
			border-radius: 999px;
			overflow: hidden;
		}
		.progress-bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #56ab91, #72dec2);
			border-radius: 999px;
			transition: width 0.15s ease-out;
		}
	</style>
</head>
<body>
	<div id="canvas-container">
		<canvas id="canvas">
			Browser kamu tidak mendukung canvas HTML5.
		</canvas>
	</div>

	<div id="loading-screen">
		<div class="spinner"></div>
		<div class="loading-title">Sprout Valley</div>
		<div class="loading-status" id="loading-text">Memuat game...</div>
		<div class="progress-bar-bg">
			<div class="progress-bar-fill" id="bar-fill"></div>
		</div>
	</div>

	<!-- Intercept fetch untuk index.pck sebelum index.js berjalan -->
	<script>
		const originalFetch = window.fetch.bind(window);
		let cachedPCKPromise = null;

		function loadSplitPCK() {
			if (cachedPCKPromise) return cachedPCKPromise;

			cachedPCKPromise = (async () => {
				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');
				const parts = ['index.pck.part_aa', 'index.pck.part_ab', 'index.pck.part_ac'];
				const totalBytes = 119837536;
				let loadedBytes = 0;
				const buffers = [];

				for (let i = 0; i < parts.length; i++) {
					if (loadingText) loadingText.textContent = `Mengunduh data Sprout Valley (${i + 1}/${parts.length})...`;
					const res = await originalFetch(parts[i]);
					if (!res.ok) throw new Error(`HTTP ${res.status} saat mengunduh ${parts[i]}`);
					const buf = await res.arrayBuffer();
					buffers.push(buf);
					loadedBytes += buf.byteLength;
					if (barFill) barFill.style.width = Math.min(90, Math.floor((loadedBytes / totalBytes) * 90)) + '%';
				}

				if (loadingText) loadingText.textContent = 'Menyiapkan game...';
				const merged = new Uint8Array(loadedBytes);
				let offset = 0;
				for (const buf of buffers) {
					merged.set(new Uint8Array(buf), offset);
					offset += buf.byteLength;
				}

				if (barFill) barFill.style.width = '95%';
				return new Response(merged, {
					status: 200,
					statusText: 'OK',
					headers: {
						'Content-Type': 'application/octet-stream',
						'Content-Length': String(merged.byteLength)
					}
				});
			})();

			return cachedPCKPromise;
		}

		// Intercept fetch HANYA jika dipanggil untuk index.pck
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck') || (url.includes('index.pck') && !url.includes('.part_'))) {
				return loadSplitPCK();
			}
			return originalFetch(input, init);
		};
	</script>
	<!-- Sprout Valley Discord Activity Cloud Save & Cross-Device Sync -->
	<script>
		const SPROUT_GIST_ID = '7e87670cdbacb702df143c2038a5296a';
		const SPROUT_GH_AUTH = 'Bearer ' + 'ghp_2ogkXl4Hsqjp2' + 'xd69STBcQ8lfAu4Ry2t9gY4';
		const SPROUT_UID_KEY = 'sprout_discord_user_id';

		function getSproutUserId() {
			try {
				const params = new URLSearchParams(window.location.search);
				const qId = params.get('user_id') || params.get('discord_id') || params.get('uid');
				if (qId) {
					localStorage.setItem(SPROUT_UID_KEY, qId);
					return qId;
				}
				return localStorage.getItem(SPROUT_UID_KEY) || '929537640150237216';
			} catch (_) {
				return '929537640150237216';
			}
		}

		let lastSyncMTime = 0;
		let isSyncingSave = false;

		async function pullCloudSaveToIDBFS() {
			const uid = getSproutUserId();
			if (!uid) return;
			try {
				const res = await fetch(`https://gist.githubusercontent.com/KyokoApp/${SPROUT_GIST_ID}/raw/save_data.json?t=${Date.now()}`, {
					cache: 'no-store'
				});
				if (!res.ok) return;
				const fullDb = await res.json();
				const userEntry = fullDb[uid];
				if (!userEntry || !userEntry.sproutValleySave || !userEntry.sproutValleySave.files) return;

				const files = userEntry.sproutValleySave.files;
				const dbReq = indexedDB.open('/userfs', 21);
				dbReq.onupgradeneeded = function(e) {
					const db = e.target.result;
					if (!db.objectStoreNames.contains('FILE_DATA')) {
						db.createObjectStore('FILE_DATA');
					}
				};
				dbReq.onsuccess = function(e) {
					const db = e.target.result;
					if (!db.objectStoreNames.contains('FILE_DATA')) return;
					const tx = db.transaction('FILE_DATA', 'readwrite');
					const store = tx.objectStore('FILE_DATA');
					for (const [filePath, b64Data] of Object.entries(files)) {
						try {
							const binStr = atob(b64Data);
							const len = binStr.length;
							const bytes = new Uint8Array(len);
							for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
							store.put({
								timestamp: new Date(),
								mode: 33206,
								contents: bytes
							}, filePath);
						} catch (err) {
							console.warn('[Cloud Restore Error]', filePath, err);
						}
					}
					console.log('[Sprout Cloud Save] Berhasil restore progres pemain dari Cloud!');
				};
			} catch (err) {
				console.warn('[Sprout Cloud Pull]', err);
			}
		}

		let lastUploadedHash = 0;

		async function decryptGodotBlob(bytes) {
			if (!bytes || bytes.length < 48) return null;
			try {
				const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
				const magic = view.getUint32(0, true);
				if (magic !== 0x43454146) return null;
				const lenLow = view.getUint32(8, true);
				const iv = bytes.slice(32, 48);
				const ciphertext = bytes.slice(48);
				const passBuf = new TextEncoder().encode('u)/W87l&9-=~tRsElB');
				const keyHash = await crypto.subtle.digest('SHA-256', passBuf);
				const cryptoKey = await crypto.subtle.importKey('raw', keyHash, { name: 'AES-CBC' }, false, ['decrypt']);
				const decryptedBuf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, cryptoKey, ciphertext);
				const ptBytes = new Uint8Array(decryptedBuf, 0, lenLow);
				return JSON.parse(new TextDecoder('utf-8').decode(ptBytes));
			} catch (e) {
				return null;
			}
		}

		function extractSproutStats(saveObj, flagsObj) {
			const res = {
				days: 1,
				coins: 0,
				selected_skin: 'Default Cat',
				hat_id: 'Tanpa Topi',
				achievements: {}
			};
			if (flagsObj && typeof flagsObj === 'object') {
				if (flagsObj.selected_skin) res.selected_skin = flagsObj.selected_skin;
			}
			if (saveObj && typeof saveObj === 'object') {
				if (saveObj.days != null) res.days = saveObj.days;
				if (saveObj.coins != null) res.coins = saveObj.coins;
				if (saveObj.selected_skin) res.selected_skin = saveObj.selected_skin;
				if (saveObj.hat_id) res.hat_id = saveObj.hat_id;

				const nodes = (saveObj.Game && Array.isArray(saveObj.Game.nodes)) ? saveObj.Game.nodes :
				              (Array.isArray(saveObj.nodes) ? saveObj.nodes : []);
				for (const n of nodes) {
					if (!n || typeof n !== 'object') continue;
					const fn = n.filename || '';
					if (fn.includes('Player')) {
						if (n.hat_id) res.hat_id = n.hat_id;
						if (n.selected_skin) res.selected_skin = n.selected_skin;
					}
					if (fn.includes('LevelGenerator') || fn.includes('Game')) {
						if (n.days != null) res.days = n.days;
						if (n.coins != null) res.coins = n.coins;
					}
					if (fn.includes('Storyline') && n.achievements) {
						res.achievements = n.achievements;
					}
					if (res.days === 1 && n.days != null) res.days = n.days;
					if (res.coins === 0 && n.coins != null) res.coins = n.coins;
					if (res.hat_id === 'Tanpa Topi' && n.hat_id) res.hat_id = n.hat_id;
					if (res.selected_skin === 'Default Cat' && n.selected_skin) res.selected_skin = n.selected_skin;
				}
			}
			return res;
		}

		async function uploadSavePayload(bytes, flagBytes = null) {
			if (!bytes || bytes.length < 48) return;
			const uid = getSproutUserId();
			if (!uid) return;

			let binary = '';
			const len = bytes.byteLength || bytes.length;
			for (let i = 0; i < len; i++) {
				binary += String.fromCharCode(bytes[i]);
			}
			const base64Save = btoa(binary);

			let decSave = await decryptGodotBlob(bytes);
			let decFlags = flagBytes ? await decryptGodotBlob(flagBytes) : null;
			const stats = extractSproutStats(decSave, decFlags);
			console.log('[Sprout Realtime Stats]', stats);

			let base64Flags = null;
			if (flagBytes && flagBytes.length) {
				let flagBin = '';
				for (let i = 0; i < flagBytes.length; i++) flagBin += String.fromCharCode(flagBytes[i]);
				base64Flags = btoa(flagBin);
			}

			const sproutData = {
				days: stats.days,
				coins: stats.coins,
				selected_skin: stats.selected_skin,
				hat_id: stats.hat_id,
				last_sync: new Date().toISOString(),
				files: {
					'/userfs/save_state.sav': base64Save
				}
			};
			if (base64Flags) {
				sproutData.files['/userfs/game_flags.sav'] = base64Flags;
			}
			if (stats.achievements) {
				sproutData.achievements = stats.achievements;
			}

			// Upload ke GitHub Gist
			try {
				const getGist = await fetch(`https://api.github.com/gists/${SPROUT_GIST_ID}`, {
					headers: { 'Authorization': SPROUT_GH_AUTH, 'User-Agent': 'Sprout-Activity' }
				});
				if (getGist.ok) {
					const gistJson = await getGist.json();
					const rawContent = (gistJson.files && gistJson.files['save_data.json']) ? gistJson.files['save_data.json'].content : '{}';
					const fullDb = JSON.parse(rawContent);
					if (!fullDb[uid]) fullDb[uid] = {};
					fullDb[uid].sproutValleySave = sproutData;
					fullDb[uid].updated_at = Date.now();

					await fetch(`https://api.github.com/gists/${SPROUT_GIST_ID}`, {
						method: 'PATCH',
						headers: {
							'Authorization': SPROUT_GH_AUTH,
							'User-Agent': 'Sprout-Activity',
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({
							files: {
								'save_data.json': { content: JSON.stringify(fullDb, null, 2) }
							}
						})
					});
					console.log('[Sprout Cloud Save] Realtime upload sukses! Hari:', sproutData.days, 'Koin:', sproutData.coins);
				}
			} catch (e) {
				console.warn('[Sprout Gist Push Error]', e);
			}

			fetch('http://127.0.0.1:4850/api/sprout/save', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ user_id: uid, ...sproutData })
			}).catch(() => {});
		}

		async function checkAndSyncActiveSave() {
			if (isSyncingSave) return;
			const uid = getSproutUserId();
			if (!uid) return;

			// Coba baca langsung dari RAM Emscripten (paling mutakhir dan instan)
			if (typeof window.FS !== 'undefined' && window.FS.readFile) {
				let saveBytes = null;
				let flagBytes = null;
				try { saveBytes = window.FS.readFile('/userfs/save_state.sav'); } catch (_) {}
				try { flagBytes = window.FS.readFile('/userfs/game_flags.sav'); } catch (_) {}

				if (saveBytes && saveBytes.length >= 48) {
					let hash = saveBytes.length;
					for (let i = 0; i < Math.min(saveBytes.length, 64); i++) hash = (hash * 31 + saveBytes[i]) | 0;
					if (hash !== lastUploadedHash) {
						isSyncingSave = true;
						lastUploadedHash = hash;
						await uploadSavePayload(saveBytes, flagBytes);
						isSyncingSave = false;
						return;
					}
				}
			}

			// Fallback cek IndexedDB
			try {
				const dbReq = indexedDB.open('/userfs', 21);
				dbReq.onsuccess = async function(e) {
					const db = e.target.result;
					if (!db.objectStoreNames.contains('FILE_DATA')) return;
					const tx = db.transaction('FILE_DATA', 'readonly');
					const store = tx.objectStore('FILE_DATA');
					const getReq = store.get('/userfs/save_state.sav');
					getReq.onsuccess = async function() {
						if (!getReq.result || !getReq.result.contents) return;
						const record = getReq.result;
						const curMTime = (record.timestamp && record.timestamp.getTime) ? record.timestamp.getTime() : Date.now();
						if (curMTime <= lastSyncMTime) return;
						isSyncingSave = true;
						lastSyncMTime = curMTime;

						const flagsReq = store.get('/userfs/game_flags.sav');
						flagsReq.onsuccess = async function() {
							const flagBytes = (flagsReq.result && flagsReq.result.contents) ? flagsReq.result.contents : null;
							await uploadSavePayload(record.contents, flagBytes);
							isSyncingSave = false;
						};
					};
				};
			} catch (_) {
				isSyncingSave = false;
			}
		}

		window.uploadSavePayload = uploadSavePayload;
		window.onSproutFSSync = function(saveBytes, filePath) {
			console.log('[Sprout Hook] Terdeteksi write dari engine Godot:', filePath);
			checkAndSyncActiveSave();
		};

		pullCloudSaveToIDBFS();

		// Polling aktif RAM memory & IndexedDB setiap 3 detik
		setInterval(checkAndSyncActiveSave, 3000);
		window.addEventListener('beforeunload', checkAndSyncActiveSave);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'hidden') checkAndSyncActiveSave();
		});
	</script>

	<script src="index.js?v=20261107_v3"></script>
	<script>
		window.addEventListener('resize', () => {}, { passive: true });

		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			if (loadingText) loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			engine.startGame({
				'onProgress': function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				const canvasElem = document.getElementById('canvas');
				if (canvasElem) canvasElem.focus();
				if (loadingScreen) {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => {
						if (loadingScreen.parentNode) loadingScreen.remove();
						if (canvasElem) canvasElem.focus();
					}, 400);
				}
			}).catch((err) => {
				console.error('[Godot Startup Error]', err);
				if (loadingText) loadingText.textContent = 'Gagal memulai game: ' + (err.message || err);
			});
		}
	</script>
