    <script>
      (function() {
        async function enterFullscreenAndLandscape() {
          const docEl = document.documentElement;
          try {
            if (docEl.requestFullscreen) {
              await docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
              await docEl.webkitRequestFullscreen();
            }
          } catch (err) {
            console.log("Fullscreen skipped/failed:", err);
          }

          try {
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock("landscape");
            }
          } catch (err) {
            console.log("Orientation lock skipped/failed:", err);
          }

          const overlay = document.getElementById("fs-overlay");
          if (overlay) {
            overlay.style.opacity = "0";
            overlay.style.pointerEvents = "none";
            setTimeout(function() { overlay.style.display = "none"; }, 300);
          }
          function triggerSync() {
            window.dispatchEvent(new Event("resize"));
          }

          // Multi-stage trigger to ensure landscape dimensions are locked cleanly
          [50, 150, 300, 500, 800, 1200, 1800].forEach(function(delay) {
            setTimeout(triggerSync, delay);
          });
        }

        function triggerSync() {
          window.dispatchEvent(new Event("resize"));
        }

        window.addEventListener("orientationchange", function() {
          [100, 300, 600, 1000].forEach(function(d) { setTimeout(triggerSync, d); });
        });

        if (screen.orientation) {
          screen.orientation.addEventListener("change", function() {
            [100, 300, 600, 1000].forEach(function(d) { setTimeout(triggerSync, d); });
          });
        }

        document.addEventListener("fullscreenchange", function() {
          [100, 300, 600, 1000].forEach(function(d) { setTimeout(triggerSync, d); });
        });

        var startBtn = document.getElementById("start-btn");
        if (startBtn) {
          startBtn.addEventListener("click", enterFullscreenAndLandscape);
          startBtn.addEventListener("touchend", function(e) {
            e.preventDefault();
            enterFullscreenAndLandscape();
          });
        }

        var overlay = document.getElementById("fs-overlay");
        if (overlay) {
          overlay.addEventListener("click", function(e) {
            if (e.target === overlay) enterFullscreenAndLandscape();
          });
        }
      })();
    </script>
