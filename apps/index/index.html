<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		html, body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #000000;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		/* Area game dibatasi di sisi kanan sejauh 76px agar tidak tertimpa tombol exit Discord */
		#canvas-container {
			position: absolute;
			top: 0;
			bottom: 0;
			left: 0;
			right: 76px;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #000000;
			overflow: hidden;
		}
		#canvas {
			display: block;
			outline: none;
		}

		/* Loading Screen */
		#loading-screen {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1b261b, #0f140f);
			color: #e5f0d8;
			z-index: 100;
			transition: opacity 0.5s ease;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.game-logo {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: 1px;
			color: #a8e063;
			margin-bottom: 8px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}
		.loading-status-text {
			font-size: 13px;
			color: #c0d8b0;
			margin-bottom: 22px;
		}
		.bar-track {
			width: 240px;
			height: 10px;
			background: rgba(0, 0, 0, 0.45);
			border: 1px solid rgba(168, 224, 99, 0.3);
			border-radius: 999px;
			overflow: hidden;
			padding: 1px;
		}
		.bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #a8e063, #56ab2f);
			border-radius: 999px;
			transition: width 0.15s ease;
		}
	</style>
</head>
<body>
	<div id="loading-screen">
		<div class="game-logo">🌾 Sprout Valley</div>
		<div id="loading-text" class="loading-status-text">Memeriksa data game...</div>
		<div class="bar-track">
			<div id="bar-fill" class="bar-fill"></div>
		</div>
	</div>

	<div id="canvas-container">
		<canvas id="canvas" tabindex="1">
			Browser tidak mendukung WebGL canvas.
		</canvas>
	</div>

	<!-- Hook ukuran window agar engine Godot secara absolut menyisakan ruang tombol exit Discord di sisi kanan -->
	<script>
		const SAFE_RIGHT_MARGIN = 76; // Margin aman tombol exit/close Discord Mobile
		const originalInnerWidthDescriptor = Object.getOwnPropertyDescriptor(window, 'innerWidth') || {
			get: function() { return window.visualViewport ? window.visualViewport.width : document.documentElement.clientWidth; }
		};

		// Override innerWidth khusus saat dibaca engine Godot
		try {
			Object.defineProperty(window, 'innerWidth', {
				get: function() {
					const actual = window.visualViewport ? window.visualViewport.width : (document.documentElement.clientWidth || 800);
					return Math.max(320, actual - SAFE_RIGHT_MARGIN);
				},
				configurable: true
			});
		} catch (e) {
			console.warn('[innerWidth hook warn]', e);
		}
	</script>

	<!-- Hook fetch dengan Cache Storage & IndexedDB agar instan saat dibuka ulang -->
	<script>
		const CACHE_NAME = 'sprout-valley-cache-v2';
		const DB_NAME = 'SproutValleyOfflineDB';
		const STORE_NAME = 'game_assets';
		const PCK_KEY = 'sprout_valley_pck_data_v2';
		const EXPECTED_TOTAL_BYTES = 119837536;

		// ── IndexedDB Storage Helper ─────────────────────────────────────────────
		function openIDB() {
			return new Promise((resolve, reject) => {
				if (!window.indexedDB) return reject(new Error('IndexedDB not supported'));
				const req = indexedDB.open(DB_NAME, 1);
				req.onupgradeneeded = (e) => {
					const db = e.target.result;
					if (!db.objectStoreNames.contains(STORE_NAME)) {
						db.createObjectStore(STORE_NAME);
					}
				};
				req.onsuccess = () => resolve(req.result);
				req.onerror = () => reject(req.error);
			});
		}

		async function getFromIDB(key) {
			try {
				const db = await openIDB();
				return new Promise((resolve) => {
					const tx = db.transaction(STORE_NAME, 'readonly');
					const store = tx.objectStore(STORE_NAME);
					const req = store.get(key);
					req.onsuccess = () => resolve(req.result || null);
					req.onerror = () => resolve(null);
				});
			} catch (e) {
				return null;
			}
		}

		async function saveToIDB(key, val) {
			try {
				const db = await openIDB();
				return new Promise((resolve) => {
					const tx = db.transaction(STORE_NAME, 'readwrite');
					const store = tx.objectStore(STORE_NAME);
					store.put(val, key);
					tx.oncomplete = () => resolve(true);
					tx.onerror = () => resolve(false);
				});
			} catch (e) {
				return false;
			}
		}

		// ── Pemuat Data Game dengan Cache Cepat ──────────────────────────────────
		let cachedPCKResponsePromise = null;

		function loadSplitPCK() {
			if (cachedPCKResponsePromise) return cachedPCKResponsePromise;

			cachedPCKResponsePromise = (async () => {
				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');

				// 1. Cek apakah sudah pernah tersimpan di Cache Storage browser
				if ('caches' in window) {
					try {
						const cache = await caches.open(CACHE_NAME);
						const match = await cache.match('index.pck');
						if (match) {
							const cachedBuf = await match.arrayBuffer();
							if (cachedBuf && cachedBuf.byteLength === EXPECTED_TOTAL_BYTES) {
								if (loadingText) loadingText.textContent = 'Memuat game dari cache cepat...';
								if (barFill) barFill.style.width = '95%';
								return new Response(cachedBuf, {
									status: 200,
									statusText: 'OK',
									headers: {
										'Content-Type': 'application/octet-stream',
										'Content-Length': String(cachedBuf.byteLength)
									}
								});
							}
						}
					} catch (err) {
						console.warn('[CacheStorage read err]', err);
					}
				}

				// 2. Cek apakah ada di IndexedDB
				try {
					const idbBuf = await getFromIDB(PCK_KEY);
					if (idbBuf && idbBuf.byteLength === EXPECTED_TOTAL_BYTES) {
						if (loadingText) loadingText.textContent = 'Memuat game dari penyimpanan lokal...';
						if (barFill) barFill.style.width = '95%';
						return new Response(idbBuf, {
							status: 200,
							statusText: 'OK',
							headers: {
								'Content-Type': 'application/octet-stream',
								'Content-Length': String(idbBuf.byteLength)
							}
						});
					}
				} catch (err) {
					console.warn('[IndexedDB read err]', err);
				}

				// 3. Unduh pertama kali via jaringan bila belum ada di cache
				const parts = ['index.pck.part_aa', 'index.pck.part_ab', 'index.pck.part_ac'];
				let loadedBytes = 0;
				const buffers = [];

				for (let i = 0; i < parts.length; i++) {
					if (loadingText) loadingText.textContent = `Mengunduh data Sprout Valley (${i + 1}/${parts.length})...`;
					const res = await fetch(parts[i]);
					if (!res.ok) throw new Error(`Gagal unduh ${parts[i]}: ${res.status}`);
					const reader = res.body.getReader();
					const chunks = [];
					while (true) {
						const { done, value } = await reader.read();
						if (done) break;
						chunks.push(value);
						loadedBytes += value.length;
						if (barFill) barFill.style.width = Math.min(92, Math.floor((loadedBytes / EXPECTED_TOTAL_BYTES) * 92)) + '%';
					}
					let partLen = chunks.reduce((a, b) => a + b.length, 0);
					let partBuf = new Uint8Array(partLen);
					let off = 0;
					for (const c of chunks) {
						partBuf.set(c, off);
						off += c.length;
					}
					buffers.push(partBuf);
				}

				if (loadingText) loadingText.textContent = 'Menyimpan game ke memori HP...';
				if (barFill) barFill.style.width = '96%';

				let total = buffers.reduce((a, b) => a + b.length, 0);
				let merged = new Uint8Array(total);
				let pos = 0;
				for (const b of buffers) {
					merged.set(b, pos);
					pos += b.length;
				}

				// Simpan ke CacheStorage & IndexedDB di latar belakang agar buka selanjutnya instan
				(async () => {
					try {
						if ('caches' in window) {
							const cache = await caches.open(CACHE_NAME);
							await cache.put('index.pck', new Response(merged.buffer.slice(0), {
								headers: { 'Content-Type': 'application/octet-stream' }
							}));
						}
					} catch (e) {
						console.warn('[CacheStorage save warn]', e);
					}

					try {
						await saveToIDB(PCK_KEY, merged.buffer.slice(0));
					} catch (e) {
						console.warn('[IndexedDB save warn]', e);
					}
				})();

				return new Response(merged, {
					status: 200,
					statusText: 'OK',
					headers: {
						'Content-Type': 'application/octet-stream',
						'Content-Length': String(total)
					}
				});
			})();

			return cachedPCKResponsePromise;
		}

		// Intercept fetch untuk index.pck
		const originalFetch = window.fetch;
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck')) {
				return loadSplitPCK();
			}
			return originalFetch.apply(this, arguments);
		};
	</script>

	<script src="index.js"></script>
	<script>
		// Anti-reload resize guard
		window.addEventListener('resize', (e) => {}, { passive: true });

		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		// ── Start Engine dengan startGame standar ────────────────────────────────
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			engine.startGame({
				'onProgress': function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				setTimeout(() => {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => loadingScreen.remove(), 500);
				}, 400);
			}).catch((err) => {
				console.error('[Godot Startup Error]', err);
				loadingText.textContent = 'Error: ' + (err.message || err);
			});
		}
	</script>
</body>
</html>
