<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		html, body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #0d1117;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#canvas-container {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #0d1117;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			color: white;
		}
		#canvas:focus {
			outline: none;
		}

		/* Loading Screen */
		#loading-screen {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1b261b, #0f140f);
			color: #e5f0d8;
			z-index: 100;
			transition: opacity 0.5s ease;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.game-logo {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: 1px;
			color: #a8e063;
			margin-bottom: 8px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}
		.loading-status-text {
			font-size: 13px;
			color: #c0d8b0;
			margin-bottom: 22px;
		}
		.bar-track {
			width: 240px;
			height: 10px;
			background: rgba(0, 0, 0, 0.45);
			border: 1px solid rgba(168, 224, 99, 0.3);
			border-radius: 999px;
			overflow: hidden;
			padding: 1px;
		}
		.bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #a8e063, #56ab2f);
			border-radius: 999px;
			transition: width 0.15s ease;
		}

		/* ── Mobile Touch Controls ─────────────────────────────────────────────── */
		#touch-overlay {
			position: absolute;
			inset: 0;
			pointer-events: none;
			z-index: 50;
			display: none;
		}
		body.is-mobile #touch-overlay {
			display: block;
		}

		.t-btn {
			position: absolute;
			background: rgba(22, 28, 22, 0.55);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1.5px solid rgba(168, 224, 99, 0.45);
			color: #e8f5e9;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
			transition: transform 0.06s ease, background 0.06s ease;
			touch-action: none;
			pointer-events: auto;
			user-select: none;
		}
		.t-btn:active, .t-btn.pressed {
			background: rgba(168, 224, 99, 0.85);
			color: #0f140f;
			transform: scale(0.92);
		}

		/* D-Pad (Kiri Bawah) */
		.dpad-cluster {
			position: absolute;
			bottom: max(20px, env(safe-area-inset-bottom, 20px));
			left: max(20px, env(safe-area-inset-left, 20px));
			width: 140px;
			height: 140px;
			pointer-events: none;
		}
		.d-key {
			width: 44px;
			height: 44px;
			border-radius: 12px;
			font-size: 16px;
			font-weight: bold;
		}
		.d-up    { top: 0; left: 48px; }
		.d-down  { bottom: 0; left: 48px; }
		.d-left  { top: 48px; left: 0; }
		.d-right { top: 48px; right: 0; }

		/* Action Cluster (Kanan Bawah dengan Safe-Area Margin Lebar agar tidak ketutupan) */
		.act-cluster {
			position: absolute;
			bottom: max(20px, env(safe-area-inset-bottom, 20px));
			right: max(45px, calc(env(safe-area-inset-right, 20px) + 25px));
			width: 180px;
			height: 160px;
			pointer-events: none;
		}
		.act-btn {
			border-radius: 50%;
			font-weight: 800;
		}
		/* Tombol Utama: AKSI / ENTER (Memilih di Menu / Mencangkul / Menyiram / Memancing) */
		.btn-aksi {
			width: 66px;
			height: 66px;
			bottom: 4px;
			right: 4px;
			background: rgba(168, 224, 99, 0.45);
			border-color: rgba(168, 224, 99, 0.85);
			color: #ffffff;
			font-size: 13px;
			letter-spacing: 0.5px;
		}
		/* Tombol Interaksi: E (Bicara / Buka Pintu / Periksa Objek) */
		.btn-interact {
			width: 52px;
			height: 52px;
			bottom: 12px;
			left: 20px;
			font-size: 14px;
			background: rgba(45, 110, 60, 0.55);
			border-color: rgba(168, 224, 99, 0.6);
		}
		/* Tombol Tas / Tas Ransel: TAS / I (Inventory) */
		.btn-bag {
			width: 50px;
			height: 50px;
			top: 10px;
			right: 25px;
			font-size: 12px;
			background: rgba(30, 45, 30, 0.6);
		}
		/* Tombol Menu / Pause: MENU / ESC (Kiri Atas atau Atas Tombol Tas) */
		.btn-menu {
			width: 46px;
			height: 46px;
			top: 25px;
			left: 10px;
			font-size: 10px;
			background: rgba(30, 40, 50, 0.6);
		}

		/* Tombol Switch Tool Cepat (Ganti Alat di Hotbar) */
		.btn-switch {
			position: absolute;
			bottom: max(20px, env(safe-area-inset-bottom, 20px));
			left: calc(max(20px, env(safe-area-inset-left, 20px)) + 155px);
			width: 44px;
			height: 44px;
			border-radius: 12px;
			font-size: 11px;
			font-weight: 700;
			background: rgba(40, 45, 40, 0.55);
		}
	</style>
</head>
<body>
	<div id="loading-screen">
		<div class="game-logo">🌾 Sprout Valley</div>
		<div id="loading-text" class="loading-status-text">Memuat paket game bertani...</div>
		<div class="bar-track">
			<div id="bar-fill" class="bar-fill"></div>
		</div>
	</div>

	<div id="canvas-container">
		<canvas id="canvas" tabindex="1">
			Browser tidak mendukung WebGL canvas.
		</canvas>
	</div>

	<div id="touch-overlay">
		<!-- D-pad Cluster (Gerak Karakter & Navigasi Menu) -->
		<div class="dpad-cluster">
			<div class="t-btn d-key d-up"    data-action="up">▲</div>
			<div class="t-btn d-key d-left"  data-action="left">◀</div>
			<div class="t-btn d-key d-down"  data-action="down">▼</div>
			<div class="t-btn d-key d-right" data-action="right">▶</div>
		</div>

		<!-- Tombol Ganti Alat Cepat (TAB / Switch Tool) -->
		<div class="t-btn btn-switch" data-action="switch">TAB</div>

		<!-- Action Cluster (Aman dari bezel tepi kanan layar) -->
		<div class="act-cluster">
			<div class="t-btn act-btn btn-menu"     data-action="menu">MENU</div>
			<div class="t-btn act-btn btn-bag"      data-action="bag">TAS</div>
			<div class="t-btn act-btn btn-interact" data-action="interact">E</div>
			<div class="t-btn act-btn btn-aksi"     data-action="aksi">AKSI</div>
		</div>
	</div>

	<!-- Hook fetch agar saat Godot meminta index.pck, dikembalikan gabungan chunk secara transparan -->
	<script>
		let cachedPCKResponsePromise = null;

		function loadSplitPCK() {
			if (cachedPCKResponsePromise) return cachedPCKResponsePromise;

			cachedPCKResponsePromise = (async () => {
				const parts = ['index.pck.part_aa', 'index.pck.part_ab', 'index.pck.part_ac'];
				const totalBytes = 119837536;
				let loadedBytes = 0;
				const buffers = [];

				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');

				for (let i = 0; i < parts.length; i++) {
					if (loadingText) loadingText.textContent = `Mengunduh data Sprout Valley (${i + 1}/${parts.length})...`;
					const res = await fetch(parts[i]);
					if (!res.ok) throw new Error(`Gagal unduh ${parts[i]}: ${res.status}`);
					const reader = res.body.getReader();
					const chunks = [];
					while (true) {
						const { done, value } = await reader.read();
						if (done) break;
						chunks.push(value);
						loadedBytes += value.length;
						if (barFill) barFill.style.width = Math.min(92, Math.floor((loadedBytes / totalBytes) * 92)) + '%';
					}
					let partLen = chunks.reduce((a, b) => a + b.length, 0);
					let partBuf = new Uint8Array(partLen);
					let off = 0;
					for (const c of chunks) {
						partBuf.set(c, off);
						off += c.length;
					}
					buffers.push(partBuf);
				}

				if (loadingText) loadingText.textContent = 'Menyiapkan modul engine...';
				if (barFill) barFill.style.width = '96%';

				let total = buffers.reduce((a, b) => a + b.length, 0);
				let merged = new Uint8Array(total);
				let pos = 0;
				for (const b of buffers) {
					merged.set(b, pos);
					pos += b.length;
				}

				return new Response(merged, {
					status: 200,
					statusText: 'OK',
					headers: {
						'Content-Type': 'application/octet-stream',
						'Content-Length': String(total)
					}
				});
			})();

			return cachedPCKResponsePromise;
		}

		// Intercept fetch untuk index.pck
		const originalFetch = window.fetch;
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck')) {
				return loadSplitPCK();
			}
			return originalFetch.apply(this, arguments);
		};
	</script>

	<script src="index.js"></script>
	<script>
		const isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
		if (isMobile) {
			document.body.classList.add('is-mobile');
		}

		// Anti-reload resize guard
		window.addEventListener('resize', (e) => {}, { passive: true });

		const canvas = document.querySelector('#canvas');
		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		// ── Mapping Tombol Fisik Godot Lengkap ────────────────────────────────────
		// Mengirimkan kombinasi event keyboard agar 100% diterima InputMap Godot:
		// - 'aksi': ui_accept (Enter & Space) untuk pilih menu, cangkul, sabit, siram, mancing
		// - 'interact': ui_interactH (KeyE) untuk bicara NPC, buka peti, masuk pintu
		// - 'bag': ui_inventoryH (KeyI) untuk buka tas ransel/item
		// - 'menu': ui_pauseH (Escape) untuk pause, tutup dialog, opsi
		// - 'switch': ui_select_toolH (Tab) untuk ganti alat hotbar
		// - 'up', 'down', 'left', 'right': Arrow keys + WASD
		const ACTION_MAP = {
			'up': [
				{ key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
				{ key: 'w', code: 'KeyW', keyCode: 87 }
			],
			'down': [
				{ key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
				{ key: 's', code: 'KeyS', keyCode: 83 }
			],
			'left': [
				{ key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
				{ key: 'a', code: 'KeyA', keyCode: 65 }
			],
			'right': [
				{ key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
				{ key: 'd', code: 'KeyD', keyCode: 68 }
			],
			'aksi': [
				{ key: 'Enter', code: 'Enter', keyCode: 13 },
				{ key: ' ', code: 'Space', keyCode: 32 }
			],
			'interact': [
				{ key: 'e', code: 'KeyE', keyCode: 69 }
			],
			'bag': [
				{ key: 'i', code: 'KeyI', keyCode: 73 }
			],
			'menu': [
				{ key: 'Escape', code: 'Escape', keyCode: 27 }
			],
			'switch': [
				{ key: 'Tab', code: 'Tab', keyCode: 9 }
			]
		};

		function triggerKeyEvent(type, def) {
			const ev = new KeyboardEvent(type, {
				key: def.key,
				code: def.code,
				keyCode: def.keyCode,
				which: def.keyCode,
				bubbles: true,
				cancelable: true
			});
			canvas.dispatchEvent(ev);
			window.dispatchEvent(ev);
		}

		function setupAction(el) {
			const actionName = el.getAttribute('data-action');
			const keyDefs = ACTION_MAP[actionName] || [];
			let active = false;

			const onStart = (e) => {
				e.preventDefault();
				if (active) return;
				active = true;
				el.classList.add('pressed');
				canvas.focus();
				keyDefs.forEach(def => triggerKeyEvent('keydown', def));
			};

			const onEnd = (e) => {
				e.preventDefault();
				if (!active) return;
				active = false;
				el.classList.remove('pressed');
				keyDefs.forEach(def => triggerKeyEvent('keyup', def));
			};

			el.addEventListener('touchstart', onStart, { passive: false });
			el.addEventListener('touchend', onEnd, { passive: false });
			el.addEventListener('touchcancel', onEnd, { passive: false });
			el.addEventListener('mousedown', onStart);
			el.addEventListener('mouseup', onEnd);
			el.addEventListener('mouseleave', onEnd);
		}

		document.querySelectorAll('.t-btn').forEach(setupAction);

		// ── Start Engine dengan startGame standar ────────────────────────────────
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			engine.startGame({
				'onProgress': function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				setTimeout(() => {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => loadingScreen.remove(), 500);
				}, 400);
			}).catch((err) => {
				console.error('[Godot Startup Error]', err);
				loadingText.textContent = 'Error: ' + (err.message || err);
			});
		}
	</script>
</body>
</html>
