<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #111417;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#canvas-container {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #111417;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			color: white;
		}
		#canvas:focus {
			outline: none;
		}

		/* Loading Overlay */
		#loading-screen {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1b261b, #0f140f);
			color: #e5f0d8;
			z-index: 50;
			transition: opacity 0.5s ease;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.game-logo {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: 1px;
			color: #a8e063;
			margin-bottom: 8px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}
		.loading-status-text {
			font-size: 13px;
			color: #c0d8b0;
			margin-bottom: 22px;
		}
		.bar-track {
			width: 240px;
			height: 10px;
			background: rgba(0, 0, 0, 0.45);
			border: 1px solid rgba(168, 224, 99, 0.3);
			border-radius: 999px;
			overflow: hidden;
			padding: 1px;
		}
		.bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #a8e063, #56ab2f);
			border-radius: 999px;
			transition: width 0.15s ease;
		}

		/* Cozy Mobile Touch Overlay */
		#touch-overlay {
			position: absolute;
			inset: 0;
			pointer-events: none;
			z-index: 40;
			display: none;
		}
		body.is-mobile #touch-overlay {
			display: block;
		}

		.dpad {
			position: absolute;
			bottom: 26px;
			left: 20px;
			width: 136px;
			height: 136px;
			pointer-events: auto;
		}
		.t-btn {
			position: absolute;
			background: rgba(255, 255, 255, 0.18);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1.5px solid rgba(168, 224, 99, 0.35);
			color: #e8f5e9;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
			transition: transform 0.08s ease, background 0.08s ease;
			touch-action: none;
		}
		.t-btn:active, .t-btn.pressed {
			background: rgba(168, 224, 99, 0.7);
			color: #111417;
			transform: scale(0.92);
		}
		.d-key {
			width: 44px;
			height: 44px;
			border-radius: 12px;
			font-size: 16px;
		}
		.d-up    { top: 0; left: 46px; }
		.d-down  { bottom: 0; left: 46px; }
		.d-left  { top: 46px; left: 0; }
		.d-right { top: 46px; right: 0; }

		/* Action Cluster */
		.act-group {
			position: absolute;
			bottom: 26px;
			right: 20px;
			display: flex;
			gap: 12px;
			pointer-events: auto;
			align-items: flex-end;
		}
		.act-round {
			width: 60px;
			height: 60px;
			border-radius: 50%;
			font-size: 13px;
			font-weight: 700;
		}
		.act-main {
			background: rgba(168, 224, 99, 0.3);
			border-color: rgba(168, 224, 99, 0.6);
		}
		.act-sub {
			width: 48px;
			height: 48px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.15);
			font-size: 11px;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<div id="loading-screen">
		<div class="game-logo">🌾 Sprout Valley</div>
		<div id="loading-text" class="loading-status-text">Memuat paket game bertani...</div>
		<div class="bar-track">
			<div id="bar-fill" class="bar-fill"></div>
		</div>
	</div>

	<div id="canvas-container">
		<canvas id="canvas">
			Browser tidak mendukung WebGL canvas.
		</canvas>
	</div>

	<div id="touch-overlay">
		<!-- D-pad Directional -->
		<div class="dpad">
			<div class="t-btn d-key d-up" data-key="ArrowUp" data-code="ArrowUp" data-keycode="38">▲</div>
			<div class="t-btn d-key d-left" data-key="ArrowLeft" data-code="ArrowLeft" data-keycode="37">◀</div>
			<div class="t-btn d-key d-down" data-key="ArrowDown" data-code="ArrowDown" data-keycode="40">▼</div>
			<div class="t-btn d-key d-right" data-key="ArrowRight" data-code="ArrowRight" data-keycode="39">▶</div>
		</div>

		<!-- Action buttons -->
		<div class="act-group">
			<div class="t-btn act-round act-sub" data-key="Escape" data-code="Escape" data-keycode="27">MENU</div>
			<div class="t-btn act-round act-sub" data-key="e" data-code="KeyE" data-keycode="69">E</div>
			<div class="t-btn act-round act-main" data-key=" " data-code="Space" data-keycode="32">AKSI</div>
		</div>
	</div>

	<!-- Hook fetch agar saat Godot meminta index.pck, dikembalikan gabungan chunk secara transparan -->
	<script>
		let cachedPCKResponsePromise = null;

		function loadSplitPCK() {
			if (cachedPCKResponsePromise) return cachedPCKResponsePromise;

			cachedPCKResponsePromise = (async () => {
				const parts = ['index.pck.part_aa', 'index.pck.part_ab', 'index.pck.part_ac'];
				const totalBytes = 119837536;
				let loadedBytes = 0;
				const buffers = [];

				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');

				for (let i = 0; i < parts.length; i++) {
					if (loadingText) loadingText.textContent = `Mengunduh data Sprout Valley (${i + 1}/${parts.length})...`;
					const res = await fetch(parts[i]);
					if (!res.ok) throw new Error(`Gagal unduh ${parts[i]}: ${res.status}`);
					const reader = res.body.getReader();
					const chunks = [];
					while (true) {
						const { done, value } = await reader.read();
						if (done) break;
						chunks.push(value);
						loadedBytes += value.length;
						if (barFill) barFill.style.width = Math.min(90, Math.floor((loadedBytes / totalBytes) * 90)) + '%';
					}
					let partLen = chunks.reduce((a, b) => a + b.length, 0);
					let partBuf = new Uint8Array(partLen);
					let off = 0;
					for (const c of chunks) {
						partBuf.set(c, off);
						off += c.length;
					}
					buffers.push(partBuf);
				}

				if (loadingText) loadingText.textContent = 'Menyiapkan modul engine...';
				if (barFill) barFill.style.width = '95%';

				let total = buffers.reduce((a, b) => a + b.length, 0);
				let merged = new Uint8Array(total);
				let pos = 0;
				for (const b of buffers) {
					merged.set(b, pos);
					pos += b.length;
				}

				return new Response(merged, {
					status: 200,
					statusText: 'OK',
					headers: {
						'Content-Type': 'application/octet-stream',
						'Content-Length': String(total)
					}
				});
			})();

			return cachedPCKResponsePromise;
		}

		// Intercept fetch untuk index.pck
		const originalFetch = window.fetch;
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck')) {
				return loadSplitPCK();
			}
			return originalFetch.apply(this, arguments);
		};
	</script>

	<script src="index.js"></script>
	<script>
		const isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
		if (isMobile) {
			document.body.classList.add('is-mobile');
		}

		window.addEventListener('resize', (e) => {}, { passive: true });

		const canvas = document.querySelector('#canvas');
		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		function sendKey(type, key, code, keyCode) {
			const ev = new KeyboardEvent(type, {
				key: key,
				code: code,
				keyCode: keyCode,
				which: keyCode,
				bubbles: true,
				cancelable: true
			});
			canvas.dispatchEvent(ev);
			window.dispatchEvent(ev);
		}

		function setupButton(el) {
			const key = el.getAttribute('data-key');
			const code = el.getAttribute('data-code');
			const keyCode = parseInt(el.getAttribute('data-keycode'), 10);
			let down = false;

			const start = (e) => {
				e.preventDefault();
				if (down) return;
				down = true;
				el.classList.add('pressed');
				sendKey('keydown', key, code, keyCode);
			};

			const stop = (e) => {
				e.preventDefault();
				if (!down) return;
				down = false;
				el.classList.remove('pressed');
				sendKey('keyup', key, code, keyCode);
			};

			el.addEventListener('touchstart', start, { passive: false });
			el.addEventListener('touchend', stop, { passive: false });
			el.addEventListener('touchcancel', stop, { passive: false });
			el.addEventListener('mousedown', start);
			el.addEventListener('mouseup', stop);
			el.addEventListener('mouseleave', stop);
		}

		document.querySelectorAll('.t-btn').forEach(setupButton);

		// ── Start Engine dengan startGame standar ────────────────────────────────
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			engine.startGame({
				'onProgress': function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				setTimeout(() => {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => loadingScreen.remove(), 500);
				}, 400);
			}).catch((err) => {
				console.error('[Godot Startup Error]', err);
				loadingText.textContent = 'Error: ' + (err.message || err);
			});
		}
	</script>
</body>
</html>
