<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sewa Bot WhatsApp | Soft Coffee Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdfbf7; color: #3e2f23; }
        .bg-coffee-light { background-color: #f4ece1; }
        .text-coffee-brown { color: #7a4d31; }
        .btn-coffee { background-color: #7a4d31; color: #fdfbf7; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold text-coffee-brown">Sewa Bot WhatsApp Premium</h1>
    </header>

    <main class="max-w-4xl mx-auto space-y-10">
        <!-- Status Monitor -->
        <section class="bg-coffee-light p-6 rounded-2xl">
            <h2 class="text-xl font-bold mb-4">Live Status Server</h2>
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-white p-3 rounded shadow">Bot AI: <span class="text-green-600 font-bold">Online</span></div>
                <div class="bg-white p-3 rounded shadow">Bot Downloader: <span class="text-green-600 font-bold">Online</span></div>
            </div>
        </section>

        <!-- Feature Explorer -->
        <section>
            <input type="text" placeholder="Cari fitur (mis. AI, Downloader)..." class="w-full p-3 rounded border border-coffee-brown mb-4">
            <div class="flex gap-2">
                <button class="bg-coffee-light px-4 py-1 rounded">Semua</button>
                <button class="bg-coffee-light px-4 py-1 rounded">AI</button>
            </div>
        </section>

        <!-- Chat Demo -->
        <button onclick="document.getElementById('demoModal').classList.remove('hidden')" class="btn-coffee px-6 py-2 rounded">Coba Demo Bot</button>
    </main>

    <div id="demoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl max-w-sm w-full">
            <h3 class="font-bold mb-2">Simulasi Chat</h3>
            <div class="bg-coffee-light p-3 rounded text-sm mb-4">User: .ai siapa presiden?</div>
            <div class="bg-gray-100 p-3 rounded text-sm mb-4">Bot: Presiden Indonesia adalah Prabowo Subianto.</div>
            <button onclick="document.getElementById('demoModal').classList.add('hidden')" class="text-red-500">Tutup</button>
        </div>
    </div>
</body>
</html>
