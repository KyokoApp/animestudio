<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		html, body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #000000;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#canvas-container {
			position: absolute;
			top: 0;
			bottom: 0;
			left: 0;
			right: max(68px, calc(env(safe-area-inset-right, 0px) + 60px));
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #000000;
			overflow: hidden;
		}
		#canvas {
			display: block;
			outline: none;
			touch-action: none;
		}

		/* Loading Screen */
		#loading-screen {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1b261b, #0f140f);
			color: #e5f0d8;
			z-index: 100;
			transition: opacity 0.5s ease;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.game-logo {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: 1px;
			color: #a8e063;
			margin-bottom: 8px;
			text-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}
		.loading-status-text {
			font-size: 13px;
			color: #c0d8b0;
			margin-bottom: 22px;
		}
		.bar-track {
			width: 240px;
			height: 10px;
			background: rgba(0, 0, 0, 0.45);
			border: 1px solid rgba(168, 224, 99, 0.3);
			border-radius: 999px;
			overflow: hidden;
			padding: 1px;
		}
		.bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #a8e063, #56ab2f);
			border-radius: 999px;
			transition: width 0.15s ease;
		}
	</style>
</head>
<body>
	<div id="loading-screen">
		<div class="game-logo">🌾 Sprout Valley</div>
		<div id="loading-text" class="loading-status-text">Memeriksa data game...</div>
		<div class="bar-track">
			<div id="bar-fill" class="bar-fill"></div>
		</div>
	</div>

	<div id="canvas-container">
		<canvas id="canvas" tabindex="1">
			Browser tidak mendukung WebGL canvas.
		</canvas>
	</div>


	<!-- Pemuat Data Game Cepat dengan Auto-Purge Cache Usang & Cache-Buster Otomatis -->
	<script>
		const CURRENT_BUILD_VERSION = 'v8';
		const CACHE_NAME = 'sprout-valley-cache-' + CURRENT_BUILD_VERSION;
		const EXPECTED_TOTAL_BYTES = 119837536;

		// 1. Bersihkan semua cache lama secara otomatis saat versi berganti
		(async function autoPurgeOldCaches() {
			try {
				if ('caches' in window) {
					const keys = await caches.keys();
					for (const k of keys) {
						if (k.startsWith('sprout-valley-cache-') && k !== CACHE_NAME) {
							console.log('[Cache] Purging obsolete cache:', k);
							await caches.delete(k);
						}
					}
				}
				if (window.indexedDB && indexedDB.databases) {
					const dbs = await indexedDB.databases();
					for (const db of dbs) {
						if (db.name === 'SproutValleyOfflineDB') {
							indexedDB.deleteDatabase(db.name);
						}
					}
				}
			} catch(e) {}
		})();

		let cachedPCKResponsePromise = null;

		function loadSplitPCK() {
			if (cachedPCKResponsePromise) return cachedPCKResponsePromise;

			cachedPCKResponsePromise = (async () => {
				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');

				// A. Cek apakah sudah pernah tersimpan di CacheStorage
				if ('caches' in window) {
					try {
						const cache = await caches.open(CACHE_NAME);
						const match = await cache.match('index.pck');
						if (match) {
							const cachedBuf = await match.arrayBuffer();
							if (cachedBuf && cachedBuf.byteLength === EXPECTED_TOTAL_BYTES) {
								if (loadingText) loadingText.textContent = 'Memuat game dari penyimpanan...';
								if (barFill) barFill.style.width = '100%';
								return new Response(cachedBuf, {
									status: 200,
									statusText: 'OK',
									headers: {
										'Content-Type': 'application/octet-stream',
										'Content-Length': String(cachedBuf.byteLength)
									}
								});
							}
						}
					} catch (err) {}
				}

				// B. Unduh 3 part dengan retry dan fallback
				const parts = [
					'index.pck.part_aa?v=' + CURRENT_BUILD_VERSION,
					'index.pck.part_ab?v=' + CURRENT_BUILD_VERSION,
					'index.pck.part_ac?v=' + CURRENT_BUILD_VERSION
				];

				const buffers = [];

				for (let i = 0; i < parts.length; i++) {
					if (loadingText) loadingText.textContent = `Mengunduh data Sprout Valley (${i + 1}/${parts.length})...`;
					if (barFill) barFill.style.width = Math.floor((i / parts.length) * 90) + '%';

					let buf = null;
					let lastError = null;

					// Coba hingga 3x bila jaringan Discord Mobile mengalami timeout / jitter
					for (let attempt = 1; attempt <= 3; attempt++) {
						try {
							const controller = new AbortController();
							const timeoutId = setTimeout(() => controller.abort(), 25000); // 25s timeout
							const res = await fetch(parts[i], { signal: controller.signal });
							clearTimeout(timeoutId);

							if (!res.ok) throw new Error(`HTTP ${res.status}`);
							buf = await res.arrayBuffer();
							if (buf && buf.byteLength > 0) break;
						} catch (err) {
							lastError = err;
							console.warn(`[Download Part ${i+1}] Attempt ${attempt} failed:`, err);
							if (loadingText) loadingText.textContent = `Mengunduh (${i + 1}/${parts.length}) coba ulang (${attempt}/3)...`;
							await new Promise(r => setTimeout(r, 1000));
						}
					}

					if (!buf || buf.byteLength === 0) {
						if (loadingText) loadingText.textContent = `Koneksi gagal saat mengunduh bagian ${i + 1}. Silakan buka ulang game.`;
						throw new Error(`Gagal mengunduh bagian ${i + 1}: ${lastError ? lastError.message : 'Timeout'}`);
					}

					buffers.push(new Uint8Array(buf));
					if (barFill) barFill.style.width = Math.floor(((i + 1) / parts.length) * 92) + '%';
				}

				if (loadingText) loadingText.textContent = 'Menyiapkan game...';
				if (barFill) barFill.style.width = '96%';

				let total = buffers.reduce((a, b) => a + b.length, 0);
				let merged = new Uint8Array(total);
				let pos = 0;
				for (const b of buffers) {
					merged.set(b, pos);
					pos += b.length;
				}

				// C. Simpan ke CacheStorage versi ini di latar belakang
				if ('caches' in window) {
					caches.open(CACHE_NAME).then(c => {
						c.put('index.pck', new Response(merged.buffer.slice(0), {
							headers: { 'Content-Type': 'application/octet-stream' }
						}));
					}).catch(() => {});
				}

				return new Response(merged, {
					status: 200,
					statusText: 'OK',
					headers: {
						'Content-Type': 'application/octet-stream',
						'Content-Length': String(total)
					}
				});
			})();

			return cachedPCKResponsePromise;
		}

		// Intercept fetch untuk index.pck
		const originalFetch = window.fetch;
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck') || url.includes('index.pck')) {
				return loadSplitPCK();
			}
			return originalFetch.apply(this, arguments);
		};
	</script>
	<!-- Cloud Save & Discord Activity Identity Sync Hook -->
	<script>
		(function() {
			const SPROUT_DISCORD_KEY = 'sprout_discord_user_id';
			const urlParams = new URLSearchParams(window.location.search);
			let discordUserId = urlParams.get('user_id') || urlParams.get('discord_id');
			if (discordUserId) {
				try { localStorage.setItem(SPROUT_DISCORD_KEY, discordUserId); } catch(e) {}
			}

			// Jalankan polling save checker hanya setelah engine Godot aktif (delay 15 detik)
			let lastSyncedTimestamp = 0;
			function triggerCloudSaveSync() {
				const uid = discordUserId || localStorage.getItem(SPROUT_DISCORD_KEY);
				if (!uid || !window.indexedDB) return;
				try {
					const dbReq = indexedDB.open('/userfs');
					dbReq.onsuccess = function(e) {
						const db = e.target.result;
						if (!db.objectStoreNames.contains('FILE_DATA')) {
							db.close();
							return;
						}
						const tx = db.transaction('FILE_DATA', 'readonly');
						const store = tx.objectStore('FILE_DATA');
						const getReq = store.get('/userfs/save_state.sav');
						getReq.onsuccess = function() {
							db.close();
							if (!getReq.result || !getReq.result.contents) return;
							const fileData = getReq.result.contents;
							const mtime = getReq.result.timestamp || Date.now();
							if (mtime <= lastSyncedTimestamp) return;
							lastSyncedTimestamp = mtime;
							
							const payload = {
								user_id: uid,
								last_sync: new Date().toISOString(),
								save_size: fileData.byteLength || fileData.length
							};
							
							fetch('http://127.0.0.1:4850/api/sprout/save', {
								method: 'POST',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify(payload),
								mode: 'cors'
							}).catch(() => {});
						};
						getReq.onerror = function() { db.close(); };
					};
				} catch(err) {}
			}

			setTimeout(() => {
				setInterval(triggerCloudSaveSync, 30000);
			}, 15000);
		})();
	</script>

	<script src="index.js"></script>
	<script>
		// Anti-reload resize guard
		window.addEventListener('resize', (e) => {}, { passive: true });

		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		// ── Start Engine dengan startGame standar ────────────────────────────────
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			engine.startGame({
				'onProgress': function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				const canvasElem = document.getElementById('canvas');
				if (canvasElem) canvasElem.focus();
				if (loadingScreen) {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => {
						if (loadingScreen.parentNode) loadingScreen.remove();
						if (canvasElem) canvasElem.focus();
					}, 300);
				}
			}).catch((err) => {
				console.error('[Godot Startup Error]', err);
				if (loadingText) loadingText.textContent = 'Error: ' + (err.message || err);
			});
		}
	</script>
</body>
</html>
